[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-aware-image-classification"
version = "0.1.0"
description = "Image classification with group-aware evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
cnn = ["tensorflow>=2.15,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
